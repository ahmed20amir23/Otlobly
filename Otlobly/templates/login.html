{% extends "base.html" %}

{% block content %}

<style>
.auth-container {
    min-height: 90vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.auth-card {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 40px;
    width: 100%;
    max-width: 400px;
}

.input-modern {
    background: rgba(255,255,255,0.08);
    border: none;
    color: white;
}

.input-modern::placeholder {
    color: rgba(255,255,255,0.6);
}

.input-modern:focus {
    background: rgba(255,255,255,0.1);
    color: white;
    box-shadow: none;
}

.btn-main {
    background: linear-gradient(45deg, #00ffcc, #00c6ff);
    color: black;
}
</style>

<div class="auth-container">

    <div class="auth-card fade-up">

        <h2 class="text-center mb-4">Login</h2>

        <form method="POST">

            <input type="email" name="email" class="form-control input-modern mb-3" placeholder="Email">

            <input type="password" name="password" class="form-control input-modern mb-3" placeholder="Password">

            <button class="btn btn-main w-100">Login</button>

        </form>

        <p class="text-center mt-3">
            Don't have an account? 
            <a href="/register" class="text-info">Register</a>
        </p>

    </div>

</div>

{% endblock %}
